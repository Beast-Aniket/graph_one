[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graphone-frontieratlas"
version = "1.0.0"
description = "Global AI intelligence graph ingestion platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.165.0", "uvicorn[standard]==0.54.0", "sqlalchemy[asyncio]==2.1.9", "asyncpg==0.32.0",
  "celery==5.7.0", "redis==8.2.0", "httpx==0.28.1", "beautifulsoup4==4.14.3", "lxml==6.0.2",
  "pydantic-settings==2.16.3", "boto3==1.44.9", "neo4j==6.4.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

